
[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous coding agent framework for 42 Agent Smith"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "mcp",
    "httpx",
]

[project.scripts]
sandbox = "sandbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "llm", "sandbox", "tools", "models"]
