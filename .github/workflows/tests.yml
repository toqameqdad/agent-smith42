name: Python tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and development dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run pytest -q

  sandbox-e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run sandbox worker inside a privileged Linux container
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.10-slim \
            sh -lc 'apt-get update && apt-get install -y --no-install-recommends util-linux libseccomp2 && pip install uv && uv sync --dev && uv run pytest -q tests/test_sandbox.py::test_worker_communication tests/test_mcp_sandbox_e2e.py::test_interactive_session_calls_mcp_server_end_to_end tests/test_agent_e2e.py'
